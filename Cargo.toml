[package]
name = "purple-matrix-rs"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later"
description = "A libpurple protocol plugin for Matrix on the matrix-rust-sdk, end-to-end encryption included"
repository = "https://github.com/iilonmasc/purple-matrix-rs"

[lib]
crate-type = ["staticlib"]

[dependencies]
matrix-sdk = "0.19.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync"] }

[profile.dev]
debug = "line-tables-only"

[dev-dependencies]
serde_json = "1.0.154"

# The release build is the plugin that ships: stripped, one codegen unit and fat LTO, so a pinned
# build in a client's repository stays as small as the SDK allows (°3309).
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
